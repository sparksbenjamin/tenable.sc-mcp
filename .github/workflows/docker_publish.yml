name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio

      - name: Run tests
        env:
          SC_HOST: sc.example.test
          SC_USERNAME: test-user
          SC_PASSWORD: test-pass
        run: python -m pytest tests/ -v

      - name: Import smoke test (server constructs + registers tools)
        env:
          SC_HOST: sc.example.test
          SC_USERNAME: test-user
          SC_PASSWORD: test-pass
        run: |
          python - <<'EOF'
          import asyncio
          from mcp.server.mcpserver import MCPServer
          from tools import register_all

          mcp = MCPServer(name="ci", instructions="ci")
          register_all(mcp)
          tools = asyncio.run(mcp.list_tools())
          assert len(tools) >= 10, f"expected >=10 tools, got {len(tools)}"
          print(f"OK: {len(tools)} tools registered")
          EOF

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Guarantees the image name is fully downcased for ghcr.io
      - name: Downcase Image Name
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      # Required for multi-arch builds (AMD64 + ARM64)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Sets up the container builder
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Logs into GitHub Packages container registry
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Automatically determines all tags (:latest, :v1, :v1.2.3, etc.)
      - name: Extract metadata for Docker tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      # Builds the image and pushes it securely
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Bulletproof native GitHub Action cache management
          cache-from: type=gha
          cache-to: type=gha,mode=max
